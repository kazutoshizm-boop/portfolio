<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産管理ダッシュボード v5.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #3498db;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; background: var(--card-bg); padding: 20px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header-title-wrap { display: flex; align-items: baseline; gap: 10px; }
        h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }
        .version-badge {
            font-size: 0.75rem; background-color: #e2e8f0; color: #475569;
            padding: 2px 6px; border-radius: 4px; font-weight: bold;
        }
        .total-assets-container { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .total-amount { font-size: 1.8rem; font-weight: bold; color: #2c3e50; }
        .upload-btn {
            background-color: var(--accent); color: white; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        #csvFile { display: none; }
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; margin-bottom: 20px;
        }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; }
        .card h2 { font-size: 1.1rem; color: var(--primary); border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; }
        .chart-container { position: relative; height: 280px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8f9fa; white-space: nowrap; }
        .number { text-align: right; font-variant-numeric: tabular-nums; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-auto { background-color: #e8f8f5; color: #1abc9c; }
        .badge-cash { background-color: #ebf5fb; color: #2980b9; }
        .badge-warn { background-color: #fef9e7; color: #f39c12; }
        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column; font-weight: bold;
        }
        .notice-box {
            background: #eef2f5; color: #334155; padding: 12px 16px; border-radius: 8px;
            margin-bottom: 20px; font-size: 0.85rem; border-left: 4px solid var(--accent);
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div style="font-size: 1.5rem; margin-bottom: 10px;">🔄 データを処理中...</div>
    <div id="loadingStatus" style="font-size: 0.9rem; color: #666;">少々お待ちください</div>
</div>

<div class="container">
    <header>
        <div>
            <div class="header-title-wrap">
                <h1>資産管理ダッシュボード</h1>
                <span class="version-badge">v5.0 (専用対応版)</span>
            </div>
            <div class="total-assets-container">
                <span style="font-size: 0.9rem; color: #666; font-weight: bold;">総資産額:</span>
                <span id="totalAmountDisplay" class="total-amount">¥0</span>
                <span id="usdJpyDisplay" style="font-size: 0.85rem; color: #888; margin-left: 10px;"></span>
            </div>
        </div>
        <label class="upload-btn">
            CSVを読み込む<input type="file" id="csvFile" accept=".csv">
        </label>
    </header>

    <div class="notice-box" id="infoNotice">
        💡 <strong>「ポートフォリオアプリ」形式のCSVに完全対応しました。</strong><br>
        預り金・保険・外貨・株式・暗号資産などを自動判定して表示します。
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>種別ごとの資産構成</h2>
            <div class="chart-container"><canvas id="typeChart"></canvas></div>
        </div>
        <div class="card">
            <h2>口座ごとの資産構成</h2>
            <div class="chart-container"><canvas id="accountChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <h2>資産明細</h2>
        <div style="overflow-x: auto;">
            <table id="assetTable">
                <thead>
                    <tr>
                        <th>種別</th>
                        <th>コード</th>
                        <th>銘柄・名称</th>
                        <th>口座</th>
                        <th class="number">保有数量 / 口数</th>
                        <th class="number">最新単価(WEB)</th>
                        <th class="number">評価額(円)</th>
                        <th>状態</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let globalTotalAsset = 0;
    let usdJpyRate = 150.0;
    let chartInstances = {};

    document.getElementById('csvFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        showLoading(true, "CSVファイルを解析中...");

        const reader = new FileReader();
        reader.onload = function(evt) {
            let text = "";
            try {
                text = new TextDecoder('utf-8', { fatal: true }).decode(evt.target.result);
            } catch (err) {
                text = new TextDecoder('shift-jis').decode(evt.target.result);
            }

            Papa.parse(text, {
                header: true, skipEmptyLines: 'greedy',
                complete: async (results) => {
                    await processData(results.data, results.meta.fields);
                    showLoading(false);
                }
            });
        };
        reader.readAsArrayBuffer(file);
    });

    function showLoading(show, text = "") {
        document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        if (text) document.getElementById('loadingStatus').textContent = text;
    }

    function parseNum(val) {
        if (val === undefined || val === null) return 0;
        const cleaned = String(val).replace(/,/g, '').replace(/[¥$円]/g, '').trim();
        return Number(cleaned) || 0;
    }

    async function fetchUsdJpy() {
        try {
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/USDJPY=X?interval=1d&range=1d`;
            const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const res = await Promise.race([
                fetch(proxy),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 2000))
            ]);
            const data = await res.json();
            const rate = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
            if (rate && rate > 50) usdJpyRate = rate;
        } catch (e) {
            console.warn("為替取得失敗:", e);
        }
        document.getElementById('usdJpyDisplay').textContent = `(適用為替: 1ドル = ${usdJpyRate.toFixed(2)}円)`;
    }

    async function fetchStockPrice(code) {
        if (!code) return null;
        try {
            let symbol = code.trim();
            if (/^\d{4}$/.test(symbol)) symbol = `${symbol}.T`;
            else if (symbol === 'BTC') symbol = 'BTC-JPY';
            else if (symbol === 'ETH') symbol = 'ETH-JPY';

            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
            const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const res = await Promise.race([
                fetch(proxy),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 2000))
            ]);
            const data = await res.json();
            return data?.chart?.result?.[0]?.meta?.regularMarketPrice || null;
        } catch (e) {
            return null;
        }
    }

    async function processData(data, fields) {
        globalTotalAsset = 0;
        const processedList = [];

        showLoading(true, "最新の為替レートを取得中...");
        await fetchUsdJpy();

        // 日本株・米国株・暗号資産の価格取得を高速並列化
        const fetchPromises = data.map(async (row) => {
            const type = (row['種別'] || 'その他').trim();
            const code = (row['銘柄コード'] || '').trim();
            const name = (row['銘柄・名称'] || '未設定').trim();
            const account = (row['口座'] || 'その他').trim();
            const qty = parseNum(row['数量']);
            const currency = (row['通貨'] || 'JPY').trim().toUpperCase();
            const autoFetch = parseNum(row['自動取得']);

            let unitPrice = null;
            let finalValue = 0;
            let status = 'cash';
            let statusLabel = '額面固定';

            // 1. 現金・保険・預り金・確定拠出年金など「数量がそのまま日本円/外貨評価額」のもの
            if (autoFetch === 0 || type.includes('預り金') || type.includes('保険') || type.includes('確定拠出年金')) {
                status = 'cash';
                if (currency === 'USD') {
                    finalValue = qty * usdJpyRate;
                    statusLabel = '外貨換算';
                } else {
                    finalValue = qty;
                    statusLabel = '額面直接';
                }
            } 
            // 2. 投資信託（銘柄コードなし、自動取得=1）の場合
            else if (type.includes('投資信託') && !code) {
                // 投資信託の数量は「基準価額（通常1万口単位）」または概算口数
                // 銘柄コードがないため直接金額または簡易推定処理
                finalValue = qty; // 投資信託の数量が円換算で入力されている場合の互換、または口数
                status = 'warn';
                statusLabel = '数量ダイレクト';
            }
            // 3. 株式・ETF・暗号資産など（銘柄コードあり）
            else if (code && qty > 0) {
                showLoading(true, `価格取得中: ${name}`);
                unitPrice = await fetchStockPrice(code);
                
                if (unitPrice !== null) {
                    status = 'auto';
                    statusLabel = 'WEB自動';
                    if (currency === 'USD') {
                        finalValue = unitPrice * qty * usdJpyRate;
                    } else {
                        finalValue = unitPrice * qty;
                    }
                } else {
                    // API取得失敗時のフォールバック: 数量を暫定評価額とする
                    finalValue = qty;
                    status = 'warn';
                    statusLabel = '取得失敗(数量表示)';
                }
            } else {
                finalValue = qty;
            }

            return {
                type, code, name, account, qty, currency, unitPrice, finalValue, status, statusLabel
            };
        });

        const results = await Promise.all(fetchPromises);

        results.forEach(item => {
            globalTotalAsset += item.finalValue;
            processedList.push(item);
        });

        document.getElementById('totalAmountDisplay').textContent = '¥' + Math.round(globalTotalAsset).toLocaleString();
        renderTable(processedList);
        renderCharts(processedList);
    }

    function renderTable(data) {
        const tbody = document.querySelector("#assetTable tbody");
        tbody.innerHTML = "";
        data.forEach(item => {
            const tr = document.createElement("tr");
            
            let priceText = '-';
            if (item.unitPrice !== null) {
                priceText = (item.currency === 'USD' ? '$' : '¥') + item.unitPrice.toLocaleString(undefined, {maximumFractionDigits: 2});
            }

            let badgeClass = 'badge-auto';
            if (item.status === 'cash') badgeClass = 'badge-cash';
            if (item.status === 'warn') badgeClass = 'badge-warn';

            tr.innerHTML = `
                <td>${item.type}</td>
                <td>${item.code || '-'}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.account}</td>
                <td class="number">${item.qty.toLocaleString()}</td>
                <td class="number">${priceText}</td>
                <td class="number"><strong>¥${Math.round(item.finalValue).toLocaleString()}</strong></td>
                <td><span class="badge ${badgeClass}">${item.statusLabel}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderCharts(data) {
        const aggs = { type: {}, account: {} };
        data.forEach(item => {
            aggs.type[item.type] = (aggs.type[item.type] || 0) + item.finalValue;
            aggs.account[item.account || 'その他'] = (aggs.account[item.account || 'その他'] || 0) + item.finalValue;
        });

        const drawChart = (id, obj) => {
            if (chartInstances[id]) chartInstances[id].destroy();
            chartInstances[id] = new Chart(document.getElementById(id).getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(obj),
                    datasets: [{ 
                        data: Object.values(obj), 
                        backgroundColor: ['#3498db', '#2ecc71', '#e74c3c', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'] 
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        };
        drawChart('typeChart', aggs.type);
        drawChart('accountChart', aggs.account);
    }
</script>
</body>
</html>
