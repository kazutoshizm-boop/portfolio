<!DOCTYPE html>
<!-- ========================================================= -->
<!-- 資産管理ダッシュボード App Version: v1.4.0 (2026-09-16)   -->
<!--  - ハードコード基準価格（mockPrices）の完全削除             -->
<!--  - 価格データのローカルストレージキャッシュ化 (取得日保存)  -->
<!--  - 通信失敗の完全可視化 (警告バッジ・エラー表示)           -->
<!-- ========================================================= -->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産管理ダッシュボード v1.4.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #3498db;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --success-color: #2ec4b6;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .header-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .header-left h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        .version-badge {
            font-size: 0.75rem;
            background-color: #0284c7;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .total-assets-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .total-label {
            font-size: 0.9rem;
            color: #666;
            font-weight: bold;
        }

        .total-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .toggle-btn:hover {
            background-color: #f0f0f0;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .upload-btn {
            background-color: var(--accent);
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            display: inline-block;
            font-size: 0.9rem;
        }

        .upload-btn:hover {
            background-color: #2980b9;
        }

        .clear-btn {
            background-color: #94a3b8;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background-color: #64748b;
        }

        #csvFile {
            display: none;
        }

        .status-banner {
            display: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            align-items: center;
            justify-content: space-between;
        }

        .status-loading {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .status-saved {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--primary);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary);
            font-weight: bold;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge-fast {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-proxy {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .badge-cached {
            background-color: #fef3c7;
            color: #b45309;
        }

        .badge-error {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .badge-manual {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        .number {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .text-error {
            color: var(--danger-color);
            font-weight: bold;
        }

        .val-hidden {
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <div class="header-title-wrap">
                <h1>資産管理ダッシュボード</h1>
                <span class="version-badge">v1.4.0 (通信エラー・キャッシュ厳密化)</span>
            </div>
            <div class="total-assets-container">
                <span class="total-label">総資産額:</span>
                <span id="totalAmountDisplay" class="total-amount">¥0</span>
                <button id="toggleMaskBtn" class="toggle-btn" title="表示/非表示切替">👁️</button>
            </div>
        </div>
        <div class="header-controls">
            <label class="upload-btn">
                CSVを読み込む
                <input type="file" id="csvFile" accept=".csv">
            </label>
            <button id="clearDataBtn" class="clear-btn" title="保存されたデータを消去">データをクリア</button>
        </div>
    </header>

    <div id="statusBanner" class="status-banner"></div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>種別ごとの資産構成 (時価ベース)</h2>
            <div class="chart-container">
                <canvas id="typeChart"></canvas>
            </div>
        </div>
        <div class="card">
            <h2>口座ごとの資産構成 (時価ベース)</h2>
            <div class="chart-container">
                <canvas id="accountChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>資産明細</h2>
        <div class="table-container">
            <table id="assetTable">
                <thead>
                    <tr>
                        <th>種別</th>
                        <th>銘柄コード</th>
                        <th>銘柄・名称</th>
                        <th>口座</th>
                        <th class="number">保有数量</th>
                        <th class="number">現在単価</th>
                        <th class="number">時価評価額(円)</th>
                        <th>通貨</th>
                        <th>取得ステータス</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let typeChartInstance = null;
    let accountChartInstance = null;
    let isMasked = false;
    let globalTotalAsset = 0;
    let currentParsedData = [];

    const STORAGE_KEY = 'portfolio_csv_data_v1';
    const PRICE_CACHE_KEY = 'portfolio_price_cache_v1';

    document.addEventListener("DOMContentLoaded", () => {
        // 1. ローカルストレージにCSVデータがあれば自動で読み込む
        const savedCsv = localStorage.getItem(STORAGE_KEY);
        if (savedCsv) {
            showStatus('💾 保存されたCSVデータを読み込んでいます...', 'status-loading');
            parseAndProcessCsv(savedCsv, false);
        }

        // 2. CSVファイルアップロードイベント
        document.getElementById('csvFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showStatus('⏳ 新しいCSVファイルを処理中...', 'status-loading');

            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = evt.target.result;
                let text = "";

                try {
                    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
                } catch (err) {
                    text = new TextDecoder('shift-jis').decode(buffer);
                }

                try {
                    localStorage.setItem(STORAGE_KEY, text);
                } catch(e) {
                    console.warn('ローカルストレージ保存失敗:', e);
                }

                parseAndProcessCsv(text, true);
            };
            reader.readAsArrayBuffer(file);
        });

        // 3. データ削除ボタン（CSVと価格キャッシュの初期化）
        document.getElementById('clearDataBtn').addEventListener('click', () => {
            if (confirm('保存されているCSVデータおよび価格キャッシュを削除しますか？')) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(PRICE_CACHE_KEY);
                location.reload();
            }
        });

        // 4. マスク切替
        document.getElementById('toggleMaskBtn').addEventListener('click', () => {
            isMasked = !isMasked;
            updateMaskDisplay();
        });
    });

    function parseAndProcessCsv(csvText, isNewUpload) {
        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: async (results) => {
                const hasErrors = await processAndRender(results.data);
                
                if (hasErrors) {
                    showStatus('⚠️ 一部銘柄のリアルタイム通信に失敗しました。前回取得できたデータまたは通信エラーを表示しています。', 'status-warning');
                } else {
                    const msg = isNewUpload ? '✅ CSVデータを正常に読み込み、ローカルストレージに保存しました。' : '✅ データを最新状態で表示しています。';
                    showStatus(msg, 'status-saved');
                }
            }
        });
    }

    function showStatus(message, typeClass) {
        const banner = document.getElementById('statusBanner');
        banner.className = `status-banner ${typeClass}`;
        banner.innerHTML = message;
        banner.style.display = 'flex';
    }

    // 価格キャッシュの取得・更新ヘルパー
    function getPriceCache() {
        try {
            return JSON.parse(localStorage.getItem(PRICE_CACHE_KEY) || '{}');
        } catch (e) {
            return {};
        }
    }

    function setPriceCache(code, unitPrice) {
        try {
            const cache = getPriceCache();
            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            cache[code] = {
                price: unitPrice,
                fetchedAt: dateStr
            };
            localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(cache));
        } catch (e) {
            console.warn('価格キャッシュ保存失敗:', e);
        }
    }

    // 銘柄コードから「ティッカーコード（個別株・ETF）」かどうかを判定
    function isTickerCode(code) {
        if (!code) return false;
        const clean = String(code).trim();
        return /^\d{4}$/.test(clean) || /^[A-Za-z]+$/.test(clean);
    }

    // 価格取得ロジック（暗黙の基準価格を排除）
    async function fetchPriceForAsset(code, currency, isAuto) {
        if (!isAuto) {
            return { price: 1, routeName: '手動/固定', routeClass: 'badge-manual', error: false };
        }

        const cleanCode = String(code || '').trim();
        const priceCache = getPriceCache();

        // 1. 個別株（ティッカーあり）: API直接通信試行
        if (isTickerCode(cleanCode)) {
            const symbol = /^\d{4}$/.test(cleanCode) ? `${cleanCode}.T` : cleanCode;
            const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
            
            const proxies = [
                (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];

            for (const getProxyUrl of proxies) {
                try {
                    const proxyUrl = getProxyUrl(targetUrl);
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);

                    const response = await fetch(proxyUrl, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const json = await response.json();
                        const marketPrice = json.chart?.result?.[0]?.meta?.regularMarketPrice;
                        if (marketPrice) {
                            const usdRate = (currency === 'USD') ? 155 : 1;
                            const finalPrice = marketPrice * usdRate;
                            
                            // 通信成功時：ローカルストレージに最新価格を保存
                            setPriceCache(cleanCode, finalPrice);

                            return { 
                                price: finalPrice, 
                                routeName: 'リアルタイム取得', 
                                routeClass: 'badge-fast',
                                error: false
                            };
                        }
                    }
                } catch (err) {
                    console.warn(`[API試行失敗] ${cleanCode}`, err);
                }
            }
        } 
        // 2. 投資信託など（ティッカーなし）: 中継サーバー通信試行
        else if (cleanCode) {
            try {
                const proxyServerUrl = `https://your-proxy-server.com/api/fund?code=${encodeURIComponent(cleanCode)}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const response = await fetch(proxyServerUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.price) {
                        const finalPrice = Number(data.price);
                        
                        // 通信成功時：ローカルストレージに最新価格を保存
                        setPriceCache(cleanCode, finalPrice);

                        return { 
                            price: finalPrice, 
                            routeName: '中継サーバー経由', 
                            routeClass: 'badge-proxy',
                            error: false
                        };
                    }
                }
            } catch (err) {
                console.warn(`[中継サーバー応答なし] ${cleanCode}`, err);
            }
        }

        // 3. API通信失敗時のフォールバック処理（暗黙の基準値は全削除）
        // 過去に1度でも正常取得して保存されたデータがある場合
        if (priceCache[cleanCode]) {
            const cached = priceCache[cleanCode];
            return { 
                price: cached.price, 
                routeName: `通信失敗 (${cached.fetchedAt}データ)`, 
                routeClass: 'badge-cached',
                error: true
            };
        }

        // キャッシュすらない場合は完全に通信失敗として0表示
        return { 
            price: 0, 
            routeName: '通信失敗 (取得エラー)', 
            routeClass: 'badge-error',
            error: true
        };
    }

    async function processAndRender(data) {
        currentParsedData = [];
        globalTotalAsset = 0;
        let hasAnyError = false;

        const promises = data.map(async (row) => {
            if (!row['種別'] && !row['銘柄・名称']) return null;

            const qty = Number(String(row['数量'] || '0').replace(/,/g, '')) || 0;
            const isAuto = String(row['自動取得']).trim() === '1';
            const code = String(row['銘柄コード'] || '').trim();
            const currency = String(row['通貨'] || 'JPY').trim();

            const priceInfo = await fetchPriceForAsset(code, currency, isAuto);
            if (priceInfo.error) hasAnyError = true;

            const marketValue = isAuto ? (qty * priceInfo.price) : (qty * (currency === 'USD' ? 155 : 1));

            return {
                ...row,
                parsedQty: qty,
                unitPrice: priceInfo.price,
                marketValue: marketValue,
                isAuto: isAuto,
                routeName: priceInfo.routeName,
                routeClass: priceInfo.routeClass,
                hasError: priceInfo.error
            };
        });

        const results = await Promise.all(promises);
        currentParsedData = results.filter(item => item !== null);

        globalTotalAsset = currentParsedData.reduce((sum, item) => sum + item.marketValue, 0);

        updateMaskDisplay();
        renderTable(currentParsedData);
        renderCharts(currentParsedData);

        return hasAnyError;
    }

    function updateMaskDisplay() {
        const displayEl = document.getElementById('totalAmountDisplay');
        const btnEl = document.getElementById('toggleMaskBtn');

        if (isMasked) {
            displayEl.textContent = '¥ ********';
            displayEl.classList.add('val-hidden');
            btnEl.textContent = '🙈';
        } else {
            displayEl.textContent = '¥ ' + Math.round(globalTotalAsset).toLocaleString();
            displayEl.classList.remove('val-hidden');
            btnEl.textContent = '👁️';
        }

        const priceCells = document.querySelectorAll('.table-market-val');
        priceCells.forEach(cell => {
            const val = Number(cell.getAttribute('data-val'));
            cell.textContent = isMasked ? '****' : Math.round(val).toLocaleString();
        });
    }

    function renderTable(data) {
        const tbody = document.querySelector("#assetTable tbody");
        tbody.innerHTML = "";

        data.forEach(item => {
            const tr = document.createElement("tr");

            const displayUnitPrice = (!item.isAuto) 
                ? '-' 
                : (item.unitPrice === 0 ? '<span class="text-error">取得失敗</span>' : Math.round(item.unitPrice).toLocaleString());

            tr.innerHTML = `
                <td>${item['種別'] || ''}</td>
                <td>${item['銘柄コード'] || '-'}</td>
                <td><strong>${item['銘柄・名称'] || ''}</strong></td>
                <td>${item['口座'] || ''}</td>
                <td class="number">${item.parsedQty.toLocaleString()}</td>
                <td class="number">${displayUnitPrice}</td>
                <td class="number table-market-val" data-val="${item.marketValue}">${isMasked ? '****' : Math.round(item.marketValue).toLocaleString()}</td>
                <td>${item['通貨'] || 'JPY'}</td>
                <td><span class="badge ${item.routeClass}">${item.routeName}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderCharts(data) {
        const typeTotals = {};
        const accountTotals = {};

        data.forEach(item => {
            const type = item['種別'] || 'その他';
            const account = item['口座'] || 'その他';
            const val = item.marketValue;

            typeTotals[type] = (typeTotals[type] || 0) + val;
            accountTotals[account] = (accountTotals[account] || 0) + val;
        });

        const colors = [
            '#3498db', '#2ecc71', '#e74c3c', '#f1c40f', 
            '#9b59b6', '#34495e', '#1abc9c', '#e67e22',
            '#16a085', '#27ae60', '#2980b9', '#8e44ad'
        ];

        if (typeChartInstance) typeChartInstance.destroy();
        const ctx1 = document.getElementById('typeChart').getContext('2d');
        typeChartInstance = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: Object.keys(typeTotals),
                datasets: [{
                    data: Object.values(typeTotals),
                    backgroundColor: colors
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        if (accountChartInstance) accountChartInstance.destroy();
        const ctx2 = document.getElementById('accountChart').getContext('2d');
        accountChartInstance = new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: Object.keys(accountTotals),
                datasets: [{
                    data: Object.values(accountTotals),
                    backgroundColor: colors
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }
</script>
</body>
</html>
