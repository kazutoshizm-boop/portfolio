<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産管理ダッシュボード v2.2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #3498db;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 15px;
        }
        .header-title-wrap { display: flex; align-items: baseline; gap: 10px; }
        h1 { margin: 0; font-size: 1.4rem; color: var(--primary); }
        .version-badge { font-size: 0.75rem; background-color: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .status-badge { font-size: 0.75rem; background-color: #fef3c7; color: #d97706; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
        .status-badge.updated { background-color: #dcfce7; color: #15803d; }
        .status-badge.error { background-color: #fee2e2; color: #dc2626; }
        .total-assets-container { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .total-label { font-size: 0.9rem; color: #666; font-weight: bold; }
        .total-amount { font-size: 1.8rem; font-weight: bold; color: #2c3e50; }
        .toggle-btn { background: none; border: 1px solid var(--border-color); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .upload-btn { background-color: var(--accent); color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .upload-btn:hover { background-color: #2980b9; }
        #csvFile { display: none; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { margin-top: 0; font-size: 1.1rem; color: var(--primary); border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; }
        .chart-container { position: relative; height: 280px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8f9fa; color: var(--primary); font-weight: bold; white-space: nowrap; }
        tr:hover { background-color: #f8f9fa; }
        .number { text-align: right; font-variant-numeric: tabular-nums; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; white-space: nowrap; }
        .badge-auto { background-color: #e8f8f5; color: #1abc9c; }
        .badge-manual { background-color: #fef9e7; color: #f39c12; }
        #debugLog { background: #1e293b; color: #38bdf8; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; max-height: 120px; overflow-y: auto; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <div class="header-title-wrap">
                <h1>資産管理ダッシュボード</h1>
                <span class="version-badge">v2.2.0</span>
                <span id="statusBadge" class="status-badge">CSVファイルを読み込んでください</span>
            </div>
            <div class="total-assets-container">
                <span class="total-label">総資産額:</span>
                <span id="totalAmountDisplay" class="total-amount">¥0</span>
                <button id="toggleMaskBtn" class="toggle-btn" title="表示/非表示切替">👁️</button>
            </div>
        </div>
        <label class="upload-btn">
            CSVを読み込む
            <input type="file" id="csvFile" accept=".csv">
        </label>
    </header>

    <div id="debugLog">ログ: 待機中...</div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>種別ごとの資産構成</h2>
            <div class="chart-container"><canvas id="typeChart"></canvas></div>
        </div>
        <div class="card">
            <h2>口座ごとの資産構成</h2>
            <div class="chart-container"><canvas id="accountChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <h2>資産明細（リアルタイム更新対応）</h2>
        <div class="table-container">
            <table id="assetTable">
                <thead>
                    <tr>
                        <th>種別</th>
                        <th>銘柄コード</th>
                        <th>銘柄・名称</th>
                        <th>口座</th>
                        <th class="number">保有数量</th>
                        <th class="number">現在単価</th>
                        <th class="number">時価評価額(円)</th>
                        <th>通貨</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="9" style="text-align: center; color: #888;">右上の「CSVを読み込む」ボタンからファイルを指定してください。</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let typeChartInstance = null;
    let accountChartInstance = null;
    let isMasked = false;
    let assetData = [];

    function logMessage(msg) {
        const logEl = document.getElementById('debugLog');
        logEl.style.display = 'block';
        logEl.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }

    document.addEventListener("DOMContentLoaded", () => {
        // ダウンロードリンクの動的生成
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        document.getElementById('downloadLinkV2').href = URL.createObjectURL(blob);

        document.getElementById('csvFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            logMessage(`ファイル選択完了: ${file.name} (${file.size} bytes)`);
            document.getElementById('statusBadge').textContent = 'ファイル解析中...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = evt.target.result;
                let text = "";
                try {
                    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
                    logMessage('文字コード: UTF-8 でデコード成功');
                } catch (err) {
                    try {
                        text = new TextDecoder('shift-jis').decode(buffer);
                        logMessage('文字コード: Shift-JIS でデコード成功');
                    } catch (err2) {
                        logMessage('エラー: 文字コードのデコードに失敗しました');
                        return;
                    }
                }

                Papa.parse(text, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        logMessage(`CSVパース完了: ${results.data.length}行を検出`);
                        if (results.meta && results.meta.fields) {
                            logMessage(`検出された列名: ${results.meta.fields.join(', ')}`);
                        }
                        initializeData(results.data);
                    },
                    error: (err) => {
                        logMessage(`PapaParseエラー: ${err.message}`);
                    }
                });
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('toggleMaskBtn').addEventListener('click', () => {
            isMasked = !isMasked;
            updateDisplay();
        });
    });

    function initializeData(rawRows) {
        assetData = [];
        for (const [index, row] of rawRows.entries()) {
            // 列名の揺れ（スペースや表記違い）に柔軟に対応するためのキー探索
            const getVal = (keys) => {
                for (const k of keys) {
                    if (row[k] !== undefined && row[k] !== '') return row[k];
                    // 前後の空白を詰めて一致するものも探す
                    for (const colKey of Object.keys(row)) {
                        if (colKey.trim() === k) return row[colKey];
                    }
                }
                return '';
            };

            const type = String(getVal(['種別', 'カテゴリ'])).trim();
            const code = String(getVal(['銘柄コード', '銘柄コード・ティッカー', 'コード', 'ティッカー'])).trim();
            const name = String(getVal(['銘柄', '銘柄名', '銘柄・名称', 'ファンド名'])).trim();
            const account = String(getVal(['口座', '保有口座'])).trim();
            const qtyStr = String(getVal(['保有数量', '数量', '株数', '口数'])).replace(/,/g, '');
            const priceStr = String(getVal(['平均取得価額', '単価', '取得単価', '現在単価'])).replace(/,/g, '');
            const valStr = String(getVal(['時価評価額[円]', '評価額', '時価評価額'])).replace(/,/g, '');

            if (!name && !code) continue; // 空行スキップ

            const qty = Number(qtyStr) || 0;
            const unitPrice = Number(priceStr) || 0;
            let marketValue = Number(valStr) || (qty * unitPrice);

            assetData.push({
                type: type || 'その他',
                code: code,
                name: name || '不明な銘柄',
                account: account || '未指定',
                qty: qty,
                unitPrice: unitPrice,
                marketValue: marketValue,
                currency: 'JPY',
                status: '初期表示'
            });
        }

        logMessage(`有効な資産データ数: ${assetData.length}件`);
        if (assetData.length === 0) {
            logMessage('警告: 有効なデータが1件も読み込めませんでした。CSVの列名を確認してください。');
            document.getElementById('statusBadge').textContent = 'データ読み込みエラー';
            document.getElementById('statusBadge').className = 'status-badge error';
            return;
        }

        updateDisplay();
        startBackgroundUpdate();
    }

    function updateDisplay() {
        let total = 0;
        const tbody = document.querySelector("#assetTable tbody");
        tbody.innerHTML = "";

        assetData.forEach((item) => {
            total += item.marketValue;
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${item.type}</td>
                <td>${item.code || '-'}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.account}</td>
                <td class="number">${item.qty.toLocaleString()}</td>
                <td class="number">${item.unitPrice.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
                <td class="number">${isMasked ? '****' : Math.round(item.marketValue).toLocaleString()}</td>
                <td>${item.currency}</td>
                <td><span class="badge ${item.status === '更新完了' ? 'badge-auto' : 'badge-manual'}">${item.status}</span></td>
            `;
            tbody.appendChild(tr);
        });

        const displayEl = document.getElementById('totalAmountDisplay');
        displayEl.textContent = isMasked ? '¥ ********' : '¥ ' + Math.round(total).toLocaleString();

        renderCharts();
    }

    async function startBackgroundUpdate() {
        const badge = document.getElementById('statusBadge');
        badge.textContent = 'バックグラウンド更新中...';

        for (let i = 0; i < assetData.length; i++) {
            const item = assetData[i];
            if (item.code && item.code.length > 0) {
                const fetchedPrice = await fetchLatestPrice(item.code);
                if (fetchedPrice !== null) {
                    item.unitPrice = fetchedPrice;
                    item.marketValue = item.qty * fetchedPrice;
                    item.status = '更新完了';
                    updateDisplay();
                }
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
        }

        badge.textContent = '最新情報に更新完了';
        badge.className = 'status-badge updated';
    }

    async function fetchLatestPrice(code) {
        try {
            let symbol = code;
            if (/^\d{4}$/.test(code)) {
                symbol = `${code}.T`;
            } else if (code.toUpperCase() === 'BTC') {
                symbol = 'BTC-JPY';
            }

            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

            const res = await fetch(proxyUrl);
            if (!res.ok) return null;
            const data = await res.json();
            const meta = data?.chart?.result?.[0]?.meta;
            return meta?.regularMarketPrice || meta?.chartPreviousClose || null;
        } catch (e) {
            return null;
        }
    }

    function renderCharts() {
        const typeTotals = {};
        const accountTotals = {};

        assetData.forEach(item => {
            typeTotals[item.type] = (typeTotals[item.type] || 0) + item.marketValue;
            accountTotals[item.account] = (accountTotals[item.account] || 0) + item.marketValue;
        });

        const colors = ['#2b5c8f', '#d95f02', '#2ca02c', '#d62728', '#7570b3', '#8c564b', '#17becf', '#e377c2'];

        if (typeChartInstance) typeChartInstance.destroy();
        typeChartInstance = new Chart(document.getElementById('typeChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(typeTotals),
                datasets: [{ data: Object.values(typeTotals), backgroundColor: colors }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });

        if (accountChartInstance) accountChartInstance.destroy();
        accountChartInstance = new Chart(document.getElementById('accountChart').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(accountTotals),
                datasets: [{ data: Object.values(accountTotals), backgroundColor: colors }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
    }
</script>
</body>
</html>
